<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Try the Tab — Demo</title>
<meta name="description" content="Six nights out, split with Tab. Spin the runway, open a screen, and put tonight's bill on a practice tab.">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="preload" as="image" href="shots/1-welcome.png" fetchpriority="high">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<!-- The demo is a runway of Tab's own screens ("looks"), each a night out whose bill
     can be put on a practice tab. The tab is settled with Tab's real money maths (../calc.js). -->
<style>
:root {
  color-scheme: light;
  --font: Inter, system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --display: 'Barlow Condensed', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --ink: #0E0F11;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; max-width: 100%; font-family: var(--font); color: var(--ink); background: #fff; }
body { overflow-x: hidden; }
button, input, select { font: inherit; }
a { color: inherit; text-decoration: none; }
button { color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
[hidden] { display: none !important; }

/* ---------- header ---------- */
.site-header { height: 88px; padding: 0 40px; display: flex; align-items: center; gap: 32px; border-bottom: 1px solid #ECEDEF; background: #fff; position: relative; z-index: 50; }
.brand { margin-right: auto; display: inline-flex; font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: .01em; line-height: 1; }
.site-header nav { display: flex; gap: 28px; font-size: 14px; font-weight: 600; }
.site-header nav a { padding: 12px 0; }
.site-header nav a:hover, .site-header nav a[aria-current] { text-decoration: underline; text-underline-offset: 4px; }
#open-bag { display: flex; align-items: center; justify-content: center; gap: 5px; background: none; border: 0; min-width: 44px; min-height: 44px; cursor: pointer; }
#open-bag span { font-size: 11px; font-weight: 600; }

/* ---------- section tokens (shared with the phone sheet, which is moved onto <body>) ---------- */
runway-section, .rw-sheet-host {
  --rw-text: #0E0F11; --rw-muted: #6B6F76; --rw-accent: #0E0F11; --rw-on-accent: #fff; --rw-line: #DCDEE2;
  --rw-panel: #fff; --rw-stage: #fff;
  --rw-h: 64px; --rw-sub: 13px; --rw-label: 10px; --rw-chip: 22px; --rw-ph: 24px; --rw-pt-size: 14px; --rw-price: 13px; --rw-opt: 12px; --rw-thumb: 84px;
  --rw-panel-w: 380px; --rw-panel-pad: 32px; --rw-model-h: 560px; --rw-bar-r: 20px; --rw-pill-radius: 999px;
  --rw-speed: 5s; --rw-morph: 900ms;
  --rw-ease: cubic-bezier(.16,1,.3,1);
  --rw-ease-silk: cubic-bezier(.65,0,.35,1);
  --rw-ease-spring: cubic-bezier(.34,1.56,.64,1);
  --rw-ease-sheet: cubic-bezier(.32,.72,0,1);
  display: block; position: relative; color: var(--rw-text); background: var(--rw-panel); -webkit-font-smoothing: antialiased;
}
.rw__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
.rw__sticky { height: var(--rw-frame-h, 100svh); display: flex; flex-direction: column; }
.rw__grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) var(--rw-panel-w); grid-template-rows: minmax(0,1fr); width: 100%; }
.rw__left { position: relative; display: flex; flex-direction: column; background: var(--rw-stage); overflow: hidden; min-height: 0; }
.rw__panel { position: relative; background: var(--rw-panel); border-left: 1px solid var(--rw-line); min-height: 0; }
.rw__panel-inner { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* head */
.rw__head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 44px 56px 0; position: relative; z-index: 5; }
.rw__intro { display: flex; flex-direction: column; gap: 12px; max-width: 640px; }
.rw__title { margin: 0; font-family: var(--display); font-weight: 700; font-size: var(--rw-h); line-height: .92; letter-spacing: -.005em; text-transform: uppercase; }
.rw__sub { margin: 0; font-size: var(--rw-sub); line-height: 1.55; color: var(--rw-muted); max-width: 46ch; }

/* stage */
.rw__stage { position: relative; flex: 1 1 auto; min-height: 0; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; outline: none; overflow: hidden; z-index: 0; }
.rw__stage:focus-visible { box-shadow: inset 0 0 0 2px var(--rw-accent); }
runway-section.is-dragging .rw__stage { cursor: grabbing; }
.rw__actors, .rw__heroes { position: absolute; inset: 0; }
.rw__heroes { pointer-events: none; z-index: 1500; }
.rw__model { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; will-change: transform, opacity; opacity: 0; }
.rw__figure { position: relative; height: var(--rw-model-h); aspect-ratio: var(--rw-ar, .462); }
/* The "model" is a phone: a thin black bezel and rounded corners around a real Tab screenshot. */
.rw__art { position: absolute; inset: 0; border-radius: calc(var(--rw-model-h) * .055); background: var(--ink); padding: calc(var(--rw-model-h) * .011); box-shadow: 0 30px 60px -36px rgb(14 15 17 / .55); }
.rw__art img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; border-radius: calc(var(--rw-model-h) * .046); pointer-events: none; -webkit-user-drag: none; opacity: 0; background: #fff; }
.rw__art img.is-decoded { opacity: 1; }
.rw__hit, .rw__zoom { position: absolute; inset: 0; z-index: 1; background: transparent; border: 0; border-radius: 24px; cursor: pointer; padding: 0; }
.rw__zoom { cursor: zoom-in; pointer-events: auto; }
.rw__hit:focus-visible, .rw__zoom:focus-visible { outline: 2px solid var(--rw-accent); outline-offset: 6px; }
.rw__shadow { position: absolute; left: 50%; bottom: 0; width: 130%; height: 7%; min-height: 14px; max-height: 40px; transform: translate(-50%, 50%); filter: blur(3px); background: radial-gradient(closest-side, rgb(20 16 12/.28), rgb(20 16 12/.12) 45%, rgb(20 16 12/.03) 75%, rgb(20 16 12/0)); pointer-events: none; }
.rw__hero { position: absolute; left: var(--rw-hx, 50%); bottom: var(--rw-hy, 34px); transform: translateX(-50%) scale(var(--rw-fs, 1)); transform-origin: 50% 100%; opacity: 0; visibility: hidden; }
runway-section.rw--still .rw__hero.is-on { opacity: 1; visibility: visible; }
.rw__hero .rw__pins { display: none; }

/* light sweep */
.rw__sweep { position: absolute; inset: 0; z-index: 1550; mix-blend-mode: soft-light; pointer-events: none; overflow: hidden; }
.rw__sweep::before { content: ''; position: absolute; top: -20%; bottom: -20%; width: 42%; background: linear-gradient(100deg, transparent, rgb(255 255 255/.25) 42%, rgb(255 255 255/.55) 50%, rgb(255 255 255/.25) 58%, transparent); transform: translateX(-130%) skewX(-12deg); opacity: 0; }
.rw__stage.is-sweep .rw__sweep::before { animation: rw-sweep 1.5s var(--rw-ease-silk); }
@keyframes rw-sweep { 0% { transform: translateX(-130%) skewX(-12deg); opacity: 0; } 18% { opacity: 1; } 100% { transform: translateX(330%) skewX(-12deg); opacity: 0; } }

/* custom cursor */
runway-section.rw--cursor .rw__stage, runway-section.rw--cursor .rw__stage * { cursor: none; }
.rw__cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 1700; pointer-events: none; }
.rw__cursor-in { position: absolute; left: -42px; top: -42px; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; color: var(--rw-text); border: 1px solid color-mix(in srgb, var(--rw-text) 28%, transparent); background: color-mix(in srgb, #fff 40%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transform: scale(.3); transition: transform .6s var(--rw-ease), opacity .35s, background .35s, border-color .35s, color .35s; }
.rw__cursor-label { grid-area: 1/1; font-size: 10px; font-weight: 600; letter-spacing: .24em; padding-left: .24em; text-transform: uppercase; white-space: nowrap; transition: opacity .25s, letter-spacing .7s var(--rw-ease); }
.rw__cursor-view { opacity: 0; }
.rw__cursor.is-on .rw__cursor-in { opacity: 1; transform: scale(1); }
.rw__cursor.is-view .rw__cursor-drag { opacity: 0; }
.rw__cursor.is-view .rw__cursor-view { opacity: 1; }
.rw__cursor.is-link .rw__cursor-in { transform: scale(.2); background: var(--rw-accent); border-color: transparent; }
.rw__cursor.is-link .rw__cursor-label { opacity: 0; }
runway-section.is-dragging .rw__cursor-in { transform: scale(.74); background: var(--rw-accent); border-color: var(--rw-accent); color: var(--rw-on-accent); }
runway-section.is-dragging .rw__cursor-drag { opacity: 1; letter-spacing: .42em; }
runway-section.is-dragging .rw__cursor-view { opacity: 0; }

/* controls */
.rw__controls { display: flex; align-items: center; gap: 20px; padding: 6px 44px 30px; position: relative; z-index: 5; }
.rw__icon { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--rw-text); position: relative; cursor: pointer; padding: 0; flex: 0 0 auto; }
.rw__icon::before { content: ''; position: absolute; inset: 2px; border-radius: 50%; border: 1px solid currentColor; opacity: 0; transform: scale(.55); transition: transform .7s var(--rw-ease), opacity .4s; }
.rw__icon:hover::before { opacity: .22; transform: scale(1); }
.rw__icon svg { transition: transform .5s cubic-bezier(.2,1.6,.4,1); }
[data-rw-prev]:hover svg { transform: translateX(-4px); }
[data-rw-next]:hover svg { transform: translateX(4px); }
.rw__icon:active svg { transform: scale(.88); }
.rw__icon:focus-visible { outline: 2px solid var(--rw-accent); outline-offset: 2px; border-radius: 4px; }
.rw__auto .rw__pause { display: none; }
.rw__auto.is-playing .rw__pause { display: block; }
.rw__auto.is-playing .rw__play { display: none; }
.rw__ticks { flex: 1; display: flex; gap: 6px; min-width: 0; }
.rw__tick { flex: 0 1 44px; min-width: 14px; height: 44px; display: flex; flex-direction: column; justify-content: center; gap: 9px; color: var(--rw-muted); text-align: left; background: none; border: 0; padding: 0; cursor: pointer; transition: flex-basis .8s cubic-bezier(.2,1.25,.3,1), color .3s; }
.rw__tick[aria-current="true"] { flex: 0 0 190px; color: var(--rw-text); }
.rw__tick:hover { color: var(--rw-text); }
.rw__tick-bar { display: block; height: 2px; width: 100%; overflow: hidden; background: color-mix(in srgb, var(--rw-text) 14%, transparent); transition: transform .5s var(--rw-ease); }
.rw__tick:hover .rw__tick-bar { transform: scaleY(1.5); }
.rw__tick-bar::after { content: ''; display: block; height: 100%; background: var(--rw-text); transform: scaleX(0); transform-origin: left; transition: transform 1s var(--rw-ease), opacity .4s, background .4s; }
.rw__tick.is-past .rw__tick-bar::after { transform: scaleX(1); opacity: .35; }
.rw__tick[aria-current="true"] .rw__tick-bar::after { transform: scaleX(1); background: var(--rw-accent); opacity: 1; }
.rw__ticks.is-playing .rw__tick[aria-current="true"] .rw__tick-bar::after { transform: scaleX(0); transition: none; }
.rw__ticks.is-playing .rw__tick.is-run .rw__tick-bar::after { animation: rw-fill var(--rw-speed) linear forwards; }
@keyframes rw-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.rw__tick-label { font-size: 10px; letter-spacing: .12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; text-transform: uppercase; }
.rw__tick-name { display: none; }
.rw__tick[aria-current="true"] .rw__tick-name { display: inline; animation: rw-name-in 1.1s var(--rw-ease) .1s backwards; }
@keyframes rw-name-in { from { opacity: 0; letter-spacing: .34em; } }

/* ---------- panel ---------- */
.rw__panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 44px var(--rw-panel-pad) 18px; }
.rw__panel-title { margin: 0; font-family: var(--display); font-weight: 700; font-size: var(--rw-ph); line-height: 1.1; text-transform: uppercase; }
.rw__label { font-size: var(--rw-label); letter-spacing: .16em; text-transform: uppercase; color: var(--rw-muted); white-space: nowrap; }
.rw__label.is-swap { animation: rw-fade .8s var(--rw-ease); }
@keyframes rw-fade { from { opacity: 0; transform: translateY(6px); } }
.rw__look-panel { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
.rw__mhead { display: none; }
.rw__items { list-style: none; margin: 0; padding: 6px var(--rw-panel-pad) 20px; display: flex; flex-direction: column; overflow-y: auto; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; scrollbar-width: thin; }
.rw__item { position: relative; display: grid; grid-template-columns: var(--rw-thumb) minmax(0,1fr) 44px; column-gap: 18px; align-items: center; padding: 18px 0; border-top: 1px solid var(--rw-line); }
.rw__item:last-child { border-bottom: 1px solid var(--rw-line); }
.rw__item::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--rw-accent); transform: scaleX(0); transform-origin: left; transition: transform .9s var(--rw-ease); }
.rw__item.is-hot::after { transform: scaleX(1); }
@media (hover: hover) { .rw__item:hover::after { transform: scaleX(1); } }
/* Thumbnail: a sticker tile with the item's icon, like a group on Tab's Home. */
.rw__media { position: relative; display: grid; place-items: center; aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: var(--c); }
.rw__media svg { width: 42%; height: 42%; transition: transform 1.4s var(--rw-ease); }
@media (hover: hover) { .rw__item:hover .rw__media svg { transform: scale(1.12) rotate(-6deg); } }
.rw__num { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255/.9); font-size: 10px; font-weight: 600; transition: background .3s, color .3s, transform .45s cubic-bezier(.2,1.6,.4,1); }
.rw__item.is-hot .rw__num { background: var(--rw-accent); color: var(--rw-on-accent); transform: scale(1.12); }
@media (hover: hover) { .rw__item:hover .rw__num { background: var(--rw-accent); color: var(--rw-on-accent); transform: scale(1.12); } }
.rw__info { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.rw__type { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--rw-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rw__name { font-size: var(--rw-pt-size); font-weight: 500; line-height: 1.3; }
.rw__price { font-size: var(--rw-price); display: flex; flex-wrap: wrap; column-gap: 8px; color: var(--rw-muted); }
.rw__price > * { white-space: nowrap; }
.rw__price b { color: var(--rw-text); font-weight: 500; }

/* plus button */
.rw__add { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; padding: 0; position: relative; cursor: pointer; align-self: center; }
.rw__add svg { grid-area: 1/1; transition: transform .55s cubic-bezier(.2,1.6,.4,1), opacity .2s; }
.rw__add .i-check, .rw__add .i-spin { opacity: 0; }
.rw__add::before { content: ''; position: absolute; inset: 4px; border-radius: 20px; border: 1px solid currentColor; opacity: 0; transform: scale(.55); transition: transform .7s var(--rw-ease), opacity .4s; }
.rw__add:hover::before, .rw__item.is-picking .rw__add::before { opacity: .22; transform: scale(1); }
.rw__item.is-picking .i-plus { transform: rotate(45deg); }
.rw__add:focus-visible { outline: 2px solid var(--rw-accent); outline-offset: 2px; border-radius: 22px; }
.rw__item.is-loading .i-plus { opacity: 0; }
.rw__item.is-loading .i-spin { opacity: 1; animation: rw-spin .8s linear infinite; }
@keyframes rw-spin { to { transform: rotate(360deg); } }
.rw__item.is-added .i-plus { opacity: 0; }
.rw__item.is-added .i-check { opacity: 1; color: var(--rw-accent); animation: rw-pop .6s cubic-bezier(.2,1.6,.4,1); }
.rw__item.is-added .i-check path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: rw-draw .7s var(--rw-ease) .1s forwards; }
.rw__item.is-added .rw__add { cursor: default; }
.rw__item.is-added .rw__add::before { opacity: 0; }
.rw__item.is-added .rw__add::after { content: ''; position: absolute; inset: 4px; border-radius: 20px; border: 1px solid var(--rw-accent); animation: rw-burst 1s var(--rw-ease) forwards; }
@keyframes rw-pop { 0% { transform: scale(.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes rw-draw { to { stroke-dashoffset: 0; } }
@keyframes rw-burst { from { transform: scale(.55); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }

/* picker: "Who had it?" */
.rw__picker { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 14px; padding-top: 16px; animation: rw-drop .7s var(--rw-ease); }
.rw__picker .rw__opt, .rw__picker .rw__confirm { animation: rw-rise .8s var(--rw-ease) backwards; }
.rw__picker .rw__confirm { animation-delay: .16s; }
@keyframes rw-drop { from { opacity: 0; transform: translateY(-8px); } }
@keyframes rw-rise { from { opacity: 0; transform: translateY(14px); } }
.rw__picker-head { display: none; }
.rw__opt { border: 0; padding: 0; margin: 0; min-width: 0; }
.rw__opt-name { font-size: var(--rw-opt); margin-bottom: 8px; padding: 0; color: var(--rw-text); }
.rw__opt-values { display: flex; flex-wrap: wrap; gap: 8px; }
.rw__pill { position: relative; }
.rw__pill input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.rw__pill-label { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 44px; min-height: 40px; padding: 0 14px 0 6px; border-radius: var(--rw-pill-radius); border: 1px solid var(--rw-line); font-size: var(--rw-opt); transition: background .3s, color .3s, border-color .3s, transform .45s var(--rw-ease-spring); }
.rw__dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--ink); background: var(--c); }
.rw__pill:hover .rw__pill-label { border-color: var(--rw-text); }
.rw__pill input:checked + .rw__pill-label { background: var(--rw-text); color: #fff; border-color: var(--rw-text); }
.rw__pill input:active + .rw__pill-label { transform: scale(.94); }
.rw__pill input:focus-visible + .rw__pill-label { outline: 2px solid var(--rw-accent); outline-offset: 2px; }
.rw__confirm, .rw__cta { position: relative; overflow: hidden; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 500; letter-spacing: .02em; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
.rw__confirm { min-height: 46px; font-size: 13px; transition: transform .4s cubic-bezier(.2,1.5,.4,1), opacity .3s; }
.rw__confirm:disabled { opacity: .45; cursor: default; }
.rw__confirm::before, .rw__cta::before { content: ''; position: absolute; top: 0; bottom: 0; width: 60%; background: linear-gradient(100deg, transparent, rgb(255 255 255/.26) 50%, transparent); transform: translateX(-140%) skewX(-18deg); }
.rw__confirm:not(:disabled):hover { transform: translateY(-1px); }
.rw__confirm:not(:disabled):hover::before, .rw__cta:hover::before { transform: translateX(260%) skewX(-18deg); transition: transform 1.1s var(--rw-ease); }

/* bundle footer */
.rw__bundle { padding: 20px var(--rw-panel-pad) 30px; display: flex; flex-direction: column; gap: 16px; background: var(--rw-panel); border-top: 1px solid var(--rw-line); }
.rw__msg { margin: 0; font-size: 11px; line-height: 1.45; color: var(--rw-accent); animation: rw-rise .6s var(--rw-ease); }
.rw__msg:empty { display: none; }
.rw__bundle-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.rw__bundle-copy { display: flex; flex-direction: column; gap: 3px; }
.rw__bundle-title { font-size: 13px; font-weight: 500; }
.rw__bundle-note { font-size: 11px; color: var(--rw-muted); }
.rw__bundle-price { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.rw__bundle-price small { font-size: 11px; color: var(--rw-muted); }
.rw__bundle-price strong { font-family: var(--display); font-weight: 700; font-size: 24px; }
.rw__cta { min-height: 56px; width: 100%; font-size: 13px; gap: 12px; transition: transform .6s var(--rw-ease), background .45s, color .45s, box-shadow .6s var(--rw-ease); }
.rw__cta:hover { transform: translateY(-2px); box-shadow: 0 18px 34px -22px color-mix(in srgb, var(--ink) 80%, transparent); }
.rw__cta:hover .i-arrow { transform: translateX(4px); }
.rw__cta .i-arrow { transition: transform .5s cubic-bezier(.2,1.6,.4,1); }
.rw__cta:active { transform: scale(.985); }
.rw__cta-m, .rw__cta-done, .rw__cta .i-spin { display: none; }
.rw__cta.is-loading .i-arrow { display: none; }
.rw__cta.is-loading .i-spin { display: block; animation: rw-spin .8s linear infinite; }
.rw__look-panel.is-complete .rw__cta { cursor: default; animation: rw-glow 1.8s var(--rw-ease); }
.rw__look-panel.is-complete .rw__cta-add, .rw__look-panel.is-complete .rw__cta-m, .rw__look-panel.is-complete .i-arrow { display: none; }
.rw__look-panel.is-complete .rw__cta-done { display: inline; animation: rw-rise .7s var(--rw-ease); }
@keyframes rw-glow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ink) 55%, transparent); } to { box-shadow: 0 0 0 16px transparent; } }

/* row entrance on each look */
.rw__look-panel.is-in .rw__item { animation: rw-item-in 1.1s var(--rw-ease) backwards; animation-delay: calc(var(--i) * 85ms + 140ms); }
.rw__look-panel.is-in .rw__media { animation: rw-curtain 1.2s var(--rw-ease) backwards; animation-delay: calc(var(--i) * 85ms + 200ms); }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
  // LINE's own browser can't sign in with Google and doesn't keep the login:
  // ask LINE to open the page in the phone's browser before anything else loads.
  if (/\bLine\//.test(navigator.userAgent || '') && !/[?&]openExternalBrowser=1/.test(location.search)) {
    window.tabLeaving = true;
    location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1' + location.hash);
  }
</script>
<title>Tab Bill Splitter</title>
<!-- Added to a phone's home screen, Tab opens full-screen with its own icon and name. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Tab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<!-- Open the connections the app needs while the page is still loading. -->
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://securetoken.googleapis.com">
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  /* First paint, before app.css arrives. */
  :root { color-scheme: light; }
  html, body { background: #FFFFFF; color: #0E0F11; }
</style>
</head>
<body>

<div id="app"><p class="boot">Loading your bills…</p></div>

<script src="https://unpkg.com/htm@3.1.1/preact/standalone.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

</body>
</html>
